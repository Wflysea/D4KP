<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>NAS 壁纸</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #fff;
        font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        overflow: hidden;
      }
      #app {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
      }
      #atv-stage {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }
      .atv-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 1;
      }
      #atv-loading {
        opacity: 0.75;
        font-size: 22px;
        text-align: center;
        padding: 0 8vw;
        line-height: 1.6;
      }
      #atv-setup {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 6vh 8vw;
        background: linear-gradient(160deg, #0b1f3a, #05101f);
      }
      #atv-setup h1 {
        font-size: 34px;
        margin: 0 0 8px;
        color: #eaf2ff;
      }
      .atv-form {
        display: flex;
        flex-direction: column;
        gap: 14px;
        width: min(640px, 80vw);
      }
      .atv-form label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 16px;
        color: #cfe0ff;
      }
      .atv-form input[type="text"],
      .atv-form input[type="password"],
      .atv-form select {
        font-size: 18px;
        padding: 12px 14px;
        border-radius: 10px;
        border: 2px solid #2b4a7a;
        background: #0a1830;
        color: #fff;
        outline: none;
      }
      .atv-form input:focus {
        border-color: #4f9bff;
        box-shadow: 0 0 0 3px rgba(79, 155, 255, 0.4);
      }
      .atv-check {
        flex-direction: row !important;
        align-items: center;
        gap: 10px !important;
      }
      .atv-actions {
        display: flex;
        gap: 14px;
        margin-top: 6px;
      }
      .atv-mode {
        display: flex;
        gap: 10px;
        align-items: flex-end;
        flex-wrap: wrap;
        padding: 10px 12px;
        border: 1px solid #22304f;
        border-radius: 10px;
        background: #0a1428;
      }
      .atv-mode label {
        flex: 1 1 240px;
      }
      .atv-btn {
        font-size: 18px;
        padding: 12px 26px;
        border-radius: 10px;
        border: none;
        background: #2f6fe0;
        color: #fff;
        cursor: pointer;
      }
      .atv-btn:focus {
        outline: 3px solid #9cc4ff;
      }
      .atv-btn-ghost {
        background: transparent;
        border: 2px solid #3a5a8c;
      }
      .atv-hint {
        font-size: 15px;
        color: #9fc0ff;
        margin: 0;
        text-align: center;
        line-height: 1.5;
      }
      .atv-msg {
        font-size: 15px;
        color: #ffd27a;
        min-height: 20px;
        text-align: center;
        line-height: 1.6;
      }
      .atv-version {
        margin-top: 18px;
        text-align: center;
        font-size: 13px;
        color: #7d8db0;
      }
      .atv-breadcrumb {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 2px;
        align-items: center;
        max-width: min(720px, 86vw);
      }
      .atv-crumb {
        font-size: 15px;
        padding: 4px 10px;
        border-radius: 8px;
        border: none;
        background: #0e2347;
        color: #bcd4ff;
        cursor: pointer;
      }
      .atv-crumb:focus,
      .atv-crumb:hover {
        outline: 2px solid #4f9bff;
        background: #143057;
      }
      .atv-sep {
        color: #5e7aa8;
      }
      .atv-folders {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: min(720px, 86vw);
        max-height: 42vh;
        overflow-y: auto;
      }
      .atv-folder {
        font-size: 18px;
        padding: 12px 16px;
        border-radius: 10px;
        border: 2px solid #2b4a7a;
        background: #0a1830;
        color: #cfe0ff;
        cursor: pointer;
        text-align: left;
        width: 100%;
      }
      .atv-folder:focus,
      .atv-folder:hover {
        border-color: #4f9bff;
        outline: none;
        background: #11294f;
      }
      .atv-empty,
      .atv-loading {
        font-size: 15px;
        color: #9fc0ff;
        text-align: center;
        padding: 12px;
      }
      /* 手机模式窄屏适配：TV 布局的字号/间距在竖屏手机上过大，按屏宽收缩 */
      @media (max-width: 640px) {
        #atv-setup { padding: 4vh 5vw; gap: 12px; }
        #atv-setup h1 { font-size: 22px; }
        .atv-form { width: 92vw; gap: 10px; }
        .atv-form label { font-size: 14px; }
        .atv-form input[type="text"],
        .atv-form input[type="password"],
        .atv-form select { font-size: 16px; padding: 10px 12px; }
        .atv-actions { flex-wrap: wrap; gap: 8px; }
        .atv-btn { font-size: 15px; padding: 10px 16px; }
        .atv-hint, .atv-msg { font-size: 13px; }
        .atv-folders { max-height: 46vh; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // 按当前使用模式动态加载对应交互层 bundle（电视 / 手机）。
      // 模式由原生 SharedPreferences 持久化；本页每次加载（含切换模式后的 reload）都会读取并加载对应脚本。
      (function () {
        var mode = 'tv';
        try {
          if (window.AndroidWallpaper && window.AndroidWallpaper.getAppMode) {
            mode = window.AndroidWallpaper.getAppMode() || 'tv';
          }
        } catch (e) {}
        var s = document.createElement('script');
        s.src = './dist/' + (mode === 'phone' ? 'android-phone.js' : 'android-tv.js');
        document.body.appendChild(s);
      })();
    </script>
  </body>
</html>
